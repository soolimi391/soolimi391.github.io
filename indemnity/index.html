<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>개인회생 탕감 계산기</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <div class="logo"></div>
        <div class="brandText">
          <div class="title">개인회생 탕감 계산기</div>
          <div class="sub">5문항 · 30초 · 결과는 “추정”입니다</div>
        </div>
      </div>

      <div class="topRight">
        <button id="headerCallBtn" class="btn primary headerBtn" type="button">전화상담 신청</button>
      </div>
    </header>

    <main class="card">
      <!-- PROGRESS -->
      <section class="progress">
        <div class="progressTop">
          <div id="stepText" class="stepText"></div>
        </div>
        <div class="bar">
          <div id="barFill" class="fill"></div>
        </div>
      </section>

      <!-- STEP -->
      <section id="stepArea" class="stepArea"></section>

      <!-- RESULT -->
      <section id="resultArea" class="resultArea" style="display:none;">
        <h2 class="h2">추정 결과</h2>
        <p class="muted">
          입력값 기반의 “대략적인 추정치”입니다. 실제 결과는 자료·법원 판단에 따라 달라질 수 있어요.
        </p>

        <div class="kpis">
          <div class="kpi">
            <div class="k">예상 월 변제금(범위)</div>
            <div id="kpiMonthly" class="v"></div>
          </div>
          <div class="kpi">
            <div class="k">예상 변제기간</div>
            <div id="kpiPeriod" class="v"></div>
          </div>
          <div class="kpi">
            <div class="k">예상 탕감액(범위)</div>
            <div id="kpiReliefAmt" class="v"></div>
          </div>
          <div class="kpi">
            <div class="k">예상 탕감률(범위)</div>
            <div id="kpiReliefRate" class="v"></div>
          </div>
        </div>

        <div class="note" id="resultNote"></div>

        <div class="btnRow">
          <button id="openLeadBtn" class="btn primary" type="button">무료 상담 신청하기</button>
          <button id="restartBtn" class="btn ghost" type="button">처음부터</button>
        </div>
      </section>
    </main>
  </div>

  <!-- LEAD MODAL -->
  <div id="modalBg" class="modalBg" style="display:none;"></div>

  <div id="modal" class="modal" style="display:none;" role="dialog" aria-modal="true" aria-label="상담 신청">
    <div class="modalHeader">
      <div class="modalTitle">상담 신청</div>
      <button id="closeModal" class="modalClose" type="button">×</button>
    </div>

    <div class="modalBody">
      <div class="row">
        <label>이름</label>
        <input id="name" type="text" placeholder="홍길동" autocomplete="name" />
      </div>

      <div class="row">
        <label>연락처</label>
        <div class="phoneRow">
          <select id="phonePrefix">
            <option value="010" selected>010</option>
            <option value="011">011</option>
            <option value="016">016</option>
            <option value="017">017</option>
            <option value="018">018</option>
            <option value="019">019</option>
          </select>
          <input id="phoneRest" type="tel" inputmode="numeric" placeholder="1234-5678" autocomplete="tel" />
        </div>
        <div class="muted" style="margin-top:6px;">숫자만 입력해도 자동으로 010-1234-5678 형식으로 정리됩니다.</div>
      </div>

      <div class="row">
        <label>상담 가능 시간</label>
        <div class="timeBox">
          <div class="ampm">
            <button id="amBtn" class="btn ghost selected" type="button">오전</button>
            <button id="pmBtn" class="btn ghost" type="button">오후</button>
          </div>

          <div class="timePick">
            <select id="hourSel"></select>
            <span class="sep">:</span>
            <select id="minSel"></select>
          </div>
        </div>
      </div>

      <div id="formMsg" class="formMsg"></div>
    </div>

    <div class="modalFooter">
      <button id="cancelLeadBtn" class="btn ghost" type="button">취소</button>
      <button id="submitLeadBtn" class="btn primary" type="button">상담 신청하기</button>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
