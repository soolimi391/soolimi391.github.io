<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>로그인(연동) 완료</title>
<style>
  *{box-sizing:border-box} html,body{margin:0;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,'Noto Sans KR',sans-serif;background:#f6f8fb}
  .wrap{min-height:100vh;display:grid;place-items:center;padding:28px}
  .card{width:min(720px,94vw);background:#fff;border-radius:16px;box-shadow:0 12px 30px rgba(0,0,0,.08);padding:26px 26px 30px}
  h1{margin:0 0 10px} .muted{color:#667085;font-size:14px}
  code{background:#f2f4f7;border-radius:6px;padding:2px 6px}
  .hint{margin-top:12px;background:#f3fff7;border:1px solid #e0f4e9;border-radius:8px;padding:10px 12px}
  .ok{color:#0b8a2f;font-weight:700} .bad{color:#b54708;font-weight:700}
  .row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  .btn{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;background:#eef2f7}
</style>

<div class="wrap">
  <div class="card" role="main" aria-labelledby="title">
    <h1 id="title">로그인(연동) 완료</h1>
    <p class="muted">검수용 콜백 페이지입니다. 캡처 제출 시 <b>개인정보 및 code 일부 마스킹</b>을 권장합니다.</p>

    <div id="box" class="hint" aria-live="polite"></div>

    <div class="row">
      <button class="btn" id="copyCode">code 복사</button>
      <button class="btn" id="clearState">저장된 state 초기화</button>
    </div>
  </div>
</div>

<script>
  const q = new URLSearchParams(location.search);
  const code   = q.get("code")  || "";
  const state  = q.get("state") || "";
  const stored = sessionStorage.getItem("naver_oauth_state") || "";
  const same   = stored && state && stored === state;

  const mask = v => !v ? "(없음)" : (v.length>12 ? v.slice(0,6)+"…"+v.slice(-4) : v);

  document.getElementById("box").innerHTML = `
    <div>• code: <code id="codeVal">${mask(code)}</code></div>
    <div>• state(요청/응답/저장): <code>${mask(stored)}</code> / <code>${mask(state)}</code> / <code>${mask(stored)}</code></div>
    <div style="margin-top:8px;">검증 결과: <span class="${same?'ok':'bad'}">${same?'state 일치 OK':'state 불일치(재시도 권장)'}</span></div>
  `;

  document.getElementById("copyCode").onclick  = () => navigator.clipboard.writeText(code).catch(()=>{});
  document.getElementById("clearState").onclick= () => { sessionStorage.removeItem("naver_oauth_state"); location.reload(); };
</script>

<noscript>자바스크립트가 필요합니다.</noscript>
